# docker-compose.yml
version: "3.9"

services:
  # ── Trading Bot ──────────────────────────────────
  bot:
    build: .
    container_name: ai_trading_bot
    restart: unless-stopped

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./ai/models:/app/ai/models

    # ── Healthcheck حقيقي يفحص الـ process وليس فقط أن الـ container حي ──
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

    # ── Resource Limits لمنع OOM ──────────────────
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # ── Stop Grace Period ─────────────────────────
    stop_grace_period: 30s

  # ── Watchdog Service — يعيد تشغيل الـ bot إذا مات ──
  watchdog:
    image: docker:cli
    container_name: ai_trading_watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "while true; do
        STATUS=$$(docker inspect --format='{{.State.Health.Status}}' ai_trading_bot 2>/dev/null);
        if [ \"$$STATUS\" = 'unhealthy' ]; then
          echo '[Watchdog] Bot unhealthy — restarting...';
          docker restart ai_trading_bot;
          sleep 60;
        fi;
        sleep 30;
      done"
    depends_on:
      - bot

  # ── Dashboard API ────────────────────────────────
  dashboard_api:
    build: .
    container_name: ai_trading_dashboard
    restart: unless-stopped

    command: >
      uvicorn dashboard_v2.api.main:app
      --host 0.0.0.0
      --port 8000

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - bot

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── DB Backup يومي ────────────────────────────────
  backup:
    build: .
    container_name: ai_trading_backup
    restart: "no"

    command: python scripts/backup_db.py

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups

    profiles:
      - backup